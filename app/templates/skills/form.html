{% extends 'base.html' %}{% block title %}{{ 'Edit' if skill else 'Post' }} a skill{% endblock %}{% block content %}<section class="form-page shell"><div class="page-head"><span class="eyebrow">{{ 'Update your listing' if skill else 'Offer something useful' }}</span><h1>{{ 'Edit skill' if skill else 'Post a skill' }}</h1></div><form class="glass form-panel form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="full">Listing title<input name="title" required maxlength="140" value="{{ skill.title if skill else '' }}" placeholder="e.g. Python tutoring for design help"></label><label>Skill you offer<input name="offered" required value="{{ skill.offered if skill else '' }}"></label><label>Skill you want<input name="wanted" required value="{{ skill.wanted if skill else '' }}"></label><label>Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}" {% if skill and skill.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></label><label>Experience<select name="experience">{% for level in ['Beginner friendly','Intermediate','Advanced'] %}<option {% if skill and skill.experience == level %}selected{% endif %}>{{ level }}</option>{% endfor %}</select></label><label>Availability<select name="availability">{% for item in ['Weekends','Evenings','Flexible'] %}<option {% if skill and skill.availability == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></label><label>Approximate location<input name="location" required value="{{ skill.location if skill else current_user.location }}"></label><label class="full">Description<textarea name="description" rows="7" minlength="20" required placeholder="Describe what you can teach, what a session might cover, and who it suits.">{{ skill.description if skill else '' }}</textarea></label><div class="form-actions full"><button class="button">{{ 'Save changes' if skill else 'Publish skill' }}</button><a class="text-link" href="{{ url_for('user.my_skills') if skill else url_for('main.explore') }}">Cancel</a></div></form></section>{% endblock %}

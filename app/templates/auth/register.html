{% extends 'base.html' %}{% block title %}Join — Local Skill Exchange{% endblock %}{% block content %}<section class="auth-shell"><div class="auth-card glass"><span class="eyebrow">Join the community</span><h1>Start with what you know</h1><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" required minlength="2" autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Approximate location<input name="location" required placeholder="City or neighborhood"></label><label>Password<div class="password-field"><input type="password" name="password" required minlength="8" autocomplete="new-password" data-password><button type="button" data-toggle-password>Show</button></div><small>At least 8 characters.</small></label><button class="button wide">Create account</button></form><p class="form-foot">Already a member? <a href="{{ url_for('auth.login') }}">Log in</a></p></div></section>{% endblock %}

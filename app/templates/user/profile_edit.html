{% extends 'base.html' %}{% block title %}Edit profile{% endblock %}{% block content %}<section class="form-page shell"><div class="page-head"><span class="eyebrow">Your public profile</span><h1>Edit profile</h1></div><form class="glass form-panel form-grid" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" required value="{{ current_user.name }}"></label><label>Approximate location<input name="location" required value="{{ current_user.location }}"></label><label class="full">Bio<textarea name="bio" rows="5" maxlength="800">{{ current_user.bio }}</textarea></label><label>Availability<input name="availability" value="{{ current_user.availability }}"></label><label>Profile image<input type="file" name="avatar" accept="image/png,image/jpeg"></label><div class="form-actions full"><button class="button">Save profile</button><a class="text-link" href="{{ url_for('user.profile', user_id=current_user.id) }}">Cancel</a></div></form></section>{% endblock %}

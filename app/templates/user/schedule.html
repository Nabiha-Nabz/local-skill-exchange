{% extends 'base.html' %}{% block title %}Schedule a session{% endblock %}{% block content %}<section class="form-page shell"><div class="page-head"><span class="eyebrow">{{ exchange.skill.title }}</span><h1>Schedule a session</h1></div><form class="glass form-panel form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Date and time<input type="datetime-local" name="scheduled_at" required value="{{ session.scheduled_at.strftime('%Y-%m-%dT%H:%M') if session else '' }}"></label><label>Duration in minutes<input type="number" name="duration" min="15" max="180" step="15" value="{{ session.duration if session else 60 }}"></label><label class="full">Private notes<textarea name="notes" rows="4">{{ session.notes if session else '' }}</textarea></label><button class="button">Save session</button></form></section>{% endblock %}

{% extends 'base.html' %}{% block title %}Admin · Settings{% endblock %}{% block content %}<section class="admin-shell shell">{% include 'admin/_nav.html' %}<div class="admin-main"><div class="page-head"><span class="eyebrow">Runtime configuration</span><h1>Platform settings</h1></div><form class="glass form-panel form-grid" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Platform name<input name="platform_name" value="{{ settings.platform_name }}" required></label><label>Default post duration (days)<input type="number" name="post_duration" min="1" max="365" value="{{ settings.post_duration }}"></label><label>Maximum upload size (MB)<input type="number" name="max_upload_mb" min="1" max="20" value="{{ settings.max_upload_mb }}"></label><label>Maintenance message<input name="maintenance_message" value="{{ settings.maintenance_message }}"></label><label class="check"><input type="checkbox" name="reviews_enabled" value="true" {% if settings.reviews_enabled=='true' %}checked{% endif %}> Enable reviews</label><label class="check"><input type="checkbox" name="registration_enabled" value="true" {% if settings.registration_enabled=='true' %}checked{% endif %}> Enable new registration</label><button class="button">Save settings</button></form></div></section>{% endblock %}

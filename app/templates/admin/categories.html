{% extends 'base.html' %}{% block title %}Admin · Categories{% endblock %}{% block content %}<section class="admin-shell shell">{% include 'admin/_nav.html' %}<div class="admin-main"><div class="page-head"><span class="eyebrow">Discovery structure</span><h1>Categories</h1></div><form class="glass inline-filter" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" required placeholder="New category name"><button class="button">Add category</button></form><div class="stack-list">{% for category in categories %}<form class="glass manage-row" method="post" action="{{ url_for('admin.category_action', category_id=category.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" value="{{ category.name }}" required><span class="badge {{ 'active' if category.enabled else 'disabled' }}">{{ 'enabled' if category.enabled else 'disabled' }}</span><button class="button compact secondary">Save name</button><button class="button compact secondary" name="toggle" value="1">{{ 'Disable' if category.enabled else 'Enable' }}</button></form>{% endfor %}</div></div></section>{% endblock %}
